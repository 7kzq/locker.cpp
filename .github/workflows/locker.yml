name: build werkaramel
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: build werkaramel.exe
        shell: cmd
        run: cl /std:c++20 /O2 /EHsc /utf-8 /DUNICODE /D_UNICODE werkaramel.cpp /link user32.lib gdi32.lib /out:werkaramel.exe /SUBSYSTEM:WINDOWS
      - uses: actions/upload-artifact@v4
        with:
          name: werkaramel
          path: werkaramel.exe
